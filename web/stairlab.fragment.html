<div id="stairlab-concept" aria-label="StairLab 界面概念">
  <style>
    #stairlab-concept{--sl-bg:light-dark(#f4f7f8,#101b25);--sl-panel:light-dark(#ffffff,#162430);--sl-ink:light-dark(#142c3c,#eaf2f7);--sl-dim:light-dark(#536b7b,#a5b8c6);--sl-line:light-dark(#d7e2e8,#304654);--sl-accent:light-dark(#007f8b,#6dd9e2);--sl-soft:light-dark(#e1f3f3,#183a42);--sl-step:light-dark(#e9eff2,#364e5d);--sl-front:light-dark(#cad9e0,#2a404f);--sl-side:light-dark(#b2c7d1,#223644);--sl-metal:light-dark(#f9fbfc,#d9e4eb);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--sl-ink);background:var(--sl-bg);border:1px solid var(--sl-line);border-radius:18px;overflow:hidden;width:100%;box-sizing:border-box;font-size:14px;line-height:1.5;container-type:inline-size;container-name:sl-concept}
    #stairlab-concept *{box-sizing:border-box}
    #stairlab-concept button,#stairlab-concept input{font:inherit}
    #stairlab-concept .sl-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;background:var(--sl-panel);border-bottom:1px solid var(--sl-line);flex-wrap:wrap}
    #stairlab-concept .sl-brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
    #stairlab-concept .sl-wordmark{font-size:23px;font-weight:600;letter-spacing:-1px}
    #stairlab-concept .sl-wordmark span{color:var(--sl-accent)}
    #stairlab-concept .sl-eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--sl-dim)}
    #stairlab-concept .sl-status{font-size:12px;color:var(--sl-dim);display:flex;align-items:center;gap:7px}
    #stairlab-concept .sl-dot{width:6px;height:6px;border-radius:50%;background:var(--sl-accent);display:inline-block}
    #stairlab-concept .sl-intro{padding:25px 24px 20px;display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}
    #stairlab-concept h2{font-size:25px;line-height:1.25;letter-spacing:-.6px;font-weight:500;margin:6px 0 0}
    #stairlab-concept .sl-kicker{font-size:11px;letter-spacing:1.4px;color:var(--sl-accent)}
    #stairlab-concept .sl-meta{font-size:12px;color:var(--sl-dim)}
    #stairlab-concept .sl-workspace{display:grid;grid-template-columns:minmax(0,1fr) 232px;margin:0 24px 24px;border:1px solid var(--sl-line);border-radius:12px;background:var(--sl-panel);overflow:hidden}
    #stairlab-concept .sl-stage{min-width:0;position:relative;background:var(--sl-panel)}
    #stairlab-concept .sl-toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:10px;flex-wrap:wrap}
    #stairlab-concept .sl-switch{display:flex;gap:4px;background:var(--sl-bg);padding:3px;border-radius:8px}
    #stairlab-concept button{padding:7px 11px;border:0;border-radius:6px;background:transparent;color:var(--sl-dim);font-size:12px}
    #stairlab-concept button[aria-pressed="true"]{background:var(--sl-panel);color:var(--sl-ink);box-shadow:0 1px 3px #00000012}
    #stairlab-concept .sl-scene{display:block;width:100%;height:330px}
    #stairlab-concept .sl-caption{display:flex;justify-content:space-between;padding:10px 17px 16px;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--sl-dim)}
    #stairlab-concept .sl-caption strong{font-weight:500;color:var(--sl-accent)}
    #stairlab-concept .sl-controls{border-left:1px solid var(--sl-line);padding:20px 19px;background:var(--sl-bg)}
    #stairlab-concept .sl-controls h3{margin:0 0 3px;font-size:14px;font-weight:500}
    #stairlab-concept .sl-controls .sl-note{font-size:11px;color:var(--sl-dim);margin-bottom:22px}
    #stairlab-concept .sl-field{display:block;margin:0 0 20px}
    #stairlab-concept .sl-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:10px}
    #stairlab-concept output{font-variant-numeric:tabular-nums;font-weight:500;color:var(--sl-accent)}
    #stairlab-concept input[type="range"]{display:block;width:100%;accent-color:var(--sl-accent);margin:0}
    #stairlab-concept .sl-check{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:8px}
    #stairlab-concept .sl-check input{accent-color:var(--sl-accent)}
    #stairlab-concept .sl-evidence{border-top:1px solid var(--sl-line);margin-top:22px;padding-top:15px;font-size:12px;color:var(--sl-dim)}
    #stairlab-concept .sl-evidence span{display:block;color:var(--sl-ink);margin-top:6px}
    #stairlab-concept .sl-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 25px 20px;font-size:11px;color:var(--sl-dim)}
    #stairlab-concept .sl-flow{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
    #stairlab-concept .sl-flow b{font-weight:500;color:var(--sl-ink)}
    @container sl-concept (max-width:650px){#stairlab-concept .sl-workspace{grid-template-columns:minmax(0,1fr);margin:0 14px 18px}#stairlab-concept .sl-controls{border-left:0;border-top:1px solid var(--sl-line);display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:18px}#stairlab-concept .sl-control-title,#stairlab-concept .sl-evidence{grid-column:1/-1}#stairlab-concept .sl-field{margin:0}#stairlab-concept .sl-controls .sl-note{margin-bottom:0}#stairlab-concept .sl-evidence{margin-top:0}#stairlab-concept .sl-head,#stairlab-concept .sl-intro{padding-left:18px;padding-right:18px}#stairlab-concept .sl-scene{height:290px}#stairlab-concept h2{font-size:23px}}
    @container sl-concept (max-width:380px){#stairlab-concept .sl-controls{grid-template-columns:1fr}#stairlab-concept .sl-head{padding:14px}#stairlab-concept .sl-eyebrow{letter-spacing:.6px}#stairlab-concept .sl-scene{height:260px}#stairlab-concept .sl-toolbar{padding:10px}}
  </style>
  <header class="sl-head">
    <div class="sl-brand"><div class="sl-wordmark">stair<span>lab</span><span aria-hidden="true">.</span></div><div class="sl-eyebrow">INDUSTRIAL HUMANOID LEARNING</div></div>
    <div class="sl-status"><span class="sl-dot" aria-hidden="true"></span>界面概念 · 未连接训练</div>
  </header>
  <div class="sl-intro"><div><div class="sl-kicker">SKF CHALLENGE / 01</div><h2>让每一步，都看得见。</h2></div><div class="sl-meta">G1 示意模型 / 参数化楼梯</div></div>
  <div class="sl-workspace">
    <section class="sl-stage" aria-label="楼梯与机器人几何示意">
      <div class="sl-toolbar"><div class="sl-switch" role="group" aria-label="查看方式"><button class="cursor-interaction" type="button" data-view="scene" aria-pressed="false">空间视图</button><button class="cursor-interaction" type="button" data-view="perception" aria-pressed="true">感知视图</button></div><span class="sl-meta">SCENARIO PREVIEW</span></div>
      <svg class="sl-scene" role="img" aria-label="随台阶尺寸更新的三维几何示意图，不代表机器人运行结果"></svg>
      <div class="sl-caption"><span><strong>●</strong> 地形采样 / 脚落点示意</span><span>概念预览 · 非物理仿真</span></div>
    </section>
    <aside class="sl-controls" aria-label="场景参数">
      <div class="sl-control-title"><h3>设计一段楼梯</h3><div class="sl-note">输入值用于几何预览</div></div>
      <label class="sl-field"><span class="sl-label">台阶高度 <output data-out="rise">20 cm</output></span><input aria-label="台阶高度" data-input="rise" type="range" min="6" max="20" value="20" step="1"></label>
      <label class="sl-field"><span class="sl-label">踏面深度 <output data-out="tread">40 cm</output></span><input aria-label="踏面深度" data-input="tread" type="range" min="20" max="40" value="40" step="1"></label>
      <label class="sl-field"><span class="sl-label">可用宽度 <output data-out="width">110 cm</output></span><input aria-label="可用宽度" data-input="width" type="range" min="70" max="140" value="110" step="5"></label>
      <label class="sl-check"><input type="checkbox" data-input="footholds" checked>显示脚落点示意</label>
      <div class="sl-evidence" aria-live="polite">实验记录<span>成功率、耗时、跌倒次数：待实测</span></div>
    </aside>
  </div>
  <footer class="sl-footer"><div class="sl-flow"><b>01 感知地形</b><span>→</span><b>02 学习迈步</b><span>→</span><b>03 验证泛化</b></div><span>可复现实验 · 可解释结果</span></footer>
  <script>
  (()=>{
    const root=document.getElementById('stairlab-concept');
    const svg=root.querySelector('.sl-scene');
    const defaults={rise:20,tread:40,width:110,footholds:true,view:'perception'};
    const saved=window.openai?.widgetState?.modelContent;
    const state={...defaults,...(saved&&typeof saved==='object'?saved:{})};
    const design={accent:'teal',radius:18};
    const ns='http://www.w3.org/2000/svg';
    function add(tag,attrs,parent=svg){const el=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);parent.appendChild(el);return el;}
    function render(){
      state.rise=Math.max(6,Math.min(20,Number(state.rise)||14));state.tread=Math.max(20,Math.min(40,Number(state.tread)||28));state.width=Math.max(70,Math.min(140,Number(state.width)||100));
      state.view=state.view==='perception'?'perception':'scene';
      root.style.borderRadius=design.radius+'px';
      root.style.setProperty('--sl-accent',design.accent==='blue'?'light-dark(#145eca,#83b8ff)':'light-dark(#007f8b,#6dd9e2)');
      for(const key of ['rise','tread','width']){root.querySelector('[data-out="'+key+'"]').textContent=state[key]+' cm';root.querySelector('[data-input="'+key+'"]').value=state[key];}
      root.querySelector('[data-input="footholds"]').checked=!!state.footholds;
      root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
      const w=svg.getBoundingClientRect().width||600,h=svg.getBoundingClientRect().height||330;
      svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.replaceChildren();
      const title=add('title',{});title.textContent='楼梯高 '+state.rise+' 厘米，踏面深 '+state.tread+' 厘米，宽 '+state.width+' 厘米；机器人与脚落点仅作界面示意。';
      const rise=state.rise/100,tread=state.tread/100,width=state.width/100;
      const project=(x,y,z)=>[x*.92+y*.6,-x*.30+y*.35-z];
      const corners=[[-.8,-width/2-.25,0],[-.8,width/2+.25,0],[5*tread+.3,-width/2-.25,0],[5*tread+.3,width/2+.25,0],[-.55,-.28,1.46],[-.28,.28,1.46]];
      for(let i=0;i<5;i++)for(const xx of [i*tread,(i+1)*tread])for(const yy of [-width/2,width/2])corners.push([xx,yy,(i+1)*rise]);
      const bounds=corners.map(p=>project(...p));
      const xs=bounds.map(p=>p[0]),ys=bounds.map(p=>p[1]);
      const scale=Math.min((w-42)/(Math.max(...xs)-Math.min(...xs)),(h-45)/(Math.max(...ys)-Math.min(...ys)));
      const cx=(Math.max(...xs)+Math.min(...xs))/2,cy=(Math.max(...ys)+Math.min(...ys))/2;
      const P=(x,y,z)=>{const p=project(x,y,z);return [w/2+(p[0]-cx)*scale,h/2+(p[1]-cy)*scale];};
      const pts=(arr)=>arr.map(p=>P(...p).join(',')).join(' ');
      const poly=(arr,fill,stroke='var(--sl-line)',extra={})=>add('polygon',{points:pts(arr),fill,stroke,'stroke-width':.8,...extra});
      const line=(a,b,color,sw=1,extra={})=>{const p=P(...a),q=P(...b);return add('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:color,'stroke-width':sw,...extra});};
      for(let x=-.8;x<5*tread+.4;x+=.2)line([x,-width/2-.25,0],[x,width/2+.25,0],'var(--sl-line)',.5,{opacity:.65});
      for(let y=-width/2-.25;y<width/2+.25;y+=.2)line([-.8,y,0],[5*tread+.3,y,0],'var(--sl-line)',.5,{opacity:.65});
      for(let i=4;i>=0;i--){const x=i*tread,z=(i+1)*rise;
        poly([[x,-width/2,z],[x+tread,-width/2,z],[x+tread,width/2,z],[x,width/2,z]],'var(--sl-step)');
        poly([[x,width/2,0],[x+tread,width/2,0],[x+tread,width/2,z],[x,width/2,z]],'var(--sl-side)');
        poly([[x,-width/2,i*rise],[x,width/2,i*rise],[x,width/2,z],[x,-width/2,z]],'var(--sl-front)');
      }
      if(state.view==='perception'){
        for(let i=0;i<5;i++)for(let a=1;a<=4;a++)for(let b=1;b<=9;b++){const pos=P(i*tread+a*tread/5,-width/2+b*width/10,(i+1)*rise+.007);add('circle',{cx:pos[0],cy:pos[1],r:Math.max(1.2,scale*.012),fill:'var(--sl-accent)',opacity:.48+.08*i});}
        const eye=[-.48,0,1.29];
        poly([eye,[.05,-width/2,rise+.01],[2.8*tread,-width/2,3*rise+.01]],'var(--sl-accent)','none',{opacity:.045});
        for(const p of [[.05,-width/2,rise],[.05,width/2,rise],[2.8*tread,width/2,3*rise]])line(eye,p,'var(--sl-accent)',1,{'stroke-dasharray':'4 5',opacity:.6});
      }
      if(state.footholds){
        for(let i=0;i<4;i++){const xx=(i+.5)*tread,yy=(i%2?.13:-.13),zz=(i+1)*rise+.014;poly([[xx-.065,yy-.037,zz],[xx+.065,yy-.037,zz],[xx+.065,yy+.037,zz],[xx-.065,yy+.037,zz]],'var(--sl-accent)','none',{opacity:.8});}
      }
      const joint=(p,r)=>{const [x,y]=P(...p);add('circle',{cx:x,cy:y,r:r*scale,fill:'var(--sl-ink)',stroke:'var(--sl-metal)','stroke-width':1});};
      const limb=(a,b,sw)=>{line(a,b,'var(--sl-ink)',sw*scale,{'stroke-linecap':'round'});line(a,b,'var(--sl-metal)',sw*scale*.7,{'stroke-linecap':'round'});};
      const x=-.44;
      for(const y of [-.115,.115]){const hip=[x,y,.7],knee=[x+.04,y,.38],ankle=[x-.01,y,.09];limb(hip,knee,.085);limb(knee,ankle,.075);joint(knee,.047);line([x-.065,y,.04],[x+.1,y,.04],'var(--sl-ink)',.085*scale,{'stroke-linecap':'round'});}
      poly([[x-.08,-.19,.75],[x+.08,-.19,.75],[x+.08,-.16,1.16],[x-.08,-.16,1.16]],'var(--sl-front)','var(--sl-ink)');
      poly([[x+.08,-.19,.75],[x+.08,.19,.75],[x+.08,.16,1.16],[x+.08,-.16,1.16]],'var(--sl-metal)','var(--sl-ink)');
      poly([[x-.08,-.16,1.16],[x+.08,-.16,1.16],[x+.08,.16,1.16],[x-.08,.16,1.16]],'var(--sl-step)','var(--sl-ink)');
      for(const y of [-.22,.22]){const shoulder=[x,y,1.09],elbow=[x+.04,y,.9],hand=[x+.12,y,.77];limb(shoulder,elbow,.06);limb(elbow,hand,.05);joint(elbow,.035);}
      limb([x,0,1.14],[x,0,1.23],.065);
      const head=P(x,0,1.31);add('ellipse',{cx:head[0],cy:head[1],rx:.096*scale,ry:.114*scale,fill:'var(--sl-metal)',stroke:'var(--sl-ink)','stroke-width':1});
      const visor=P(x+.065,.015,1.33);add('rect',{x:visor[0]-.043*scale,y:visor[1]-.022*scale,width:.084*scale,height:.043*scale,rx:.012*scale,fill:'var(--sl-ink)'});
      const dot=P(x+.068,.018,1.335);add('circle',{cx:dot[0],cy:dot[1],r:.01*scale,fill:'var(--sl-accent)'});
      const p=P(.04,width/2+.12,rise),q=P(.04,width/2+.12,0);
      add('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'var(--sl-accent)','stroke-width':1});
      for(const end of [p,q])add('line',{x1:end[0]-4,y1:end[1],x2:end[0]+4,y2:end[1],stroke:'var(--sl-accent)','stroke-width':1});
      const label=add('text',{x:Math.min(p[0]+9,w-51),y:(p[1]+q[1])/2+4,fill:'var(--sl-accent)','font-size':12});label.textContent=state.rise+' cm';
    }
    function save(){window.openai?.setWidgetState?.({modelContent:{...state},privateContent:null}).catch(()=>{});}
    root.querySelectorAll('[data-input]').forEach(el=>el.addEventListener('input',()=>{const key=el.dataset.input;state[key]=el.type==='checkbox'?el.checked:Number(el.value);render();}));
    root.querySelectorAll('[data-input]').forEach(el=>el.addEventListener('change',save));
    root.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{state.view=el.dataset.view;render();save();}));
    window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.modelContent;if(next){Object.assign(state,next);render();}});
    new ResizeObserver(render).observe(svg);
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'accent',{label:'强调色',options:[{label:'工业青',value:'teal'},{label:'工程蓝',value:'blue'}]});tweak.addSlider(design,'radius',{label:'外框圆角',min:0,max:24,unit:'px'});}
  })();
  </script>
</div>
